services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - STACK_NAME=${STACK_NAME}
      - APPLICATION_NAME=${APPLICATION_NAME}
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - SMTP_TLS=${SMTP_TLS}
      - SMTP_SSL=${SMTP_SSL}
      - SMTP_PORT=${SMTP_PORT}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - CHIP_API_URL=${CHIP_API_URL}
      - CHIP_SECRET_KEY=${CHIP_SECRET_KEY}
      - CHIP_BRAND_ID=${CHIP_BRAND_ID}
      - CHIP_WEBHOOK_URL=${CHIP_WEBHOOK_URL}
      - CHIP_WEBHOOK_PUBLIC_KEY=${CHIP_WEBHOOK_PUBLIC_KEY}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED}
      - SECURE_HSTS_ENABLED=${SECURE_HSTS_ENABLED}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD}
      - MAX_REQUEST_BODY_SIZE=${MAX_REQUEST_BODY_SIZE}
      - REMOVE_SERVER_HEADER=${REMOVE_SERVER_HEADER}
      - CSP_HEADER_OVERRIDE=${CSP_HEADER_OVERRIDE}
      - X_FRAME_OPTIONS=${X_FRAME_OPTIONS}
      - X_CONTENT_TYPE_OPTIONS=${X_CONTENT_TYPE_OPTIONS}
      - REFERRER_POLICY=${REFERRER_POLICY}
      - PERMISSIONS_POLICY=${PERMISSIONS_POLICY}
      - CROSS_ORIGIN_OPENER_POLICY=${CROSS_ORIGIN_OPENER_POLICY}
      - CROSS_ORIGIN_RESOURCE_POLICY=${CROSS_ORIGIN_RESOURCE_POLICY}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED}
      - RATE_LIMIT_TIER1_IP_PER_MIN=${RATE_LIMIT_TIER1_IP_PER_MIN}
      - RATE_LIMIT_TIER2_USER_PER_MIN=${RATE_LIMIT_TIER2_USER_PER_MIN}
      - RATE_LIMIT_TIER3_UPLOAD_PER_HR=${RATE_LIMIT_TIER3_UPLOAD_PER_HR}
      - RATE_LIMIT_TIER4_AI_PER_HR=${RATE_LIMIT_TIER4_AI_PER_HR}
      - MAX_CONCURRENT_AI_REQUESTS=${MAX_CONCURRENT_AI_REQUESTS}
      - MAX_LOGO_SIZE=${MAX_LOGO_SIZE}
      - MAX_OCR_SIZE=${MAX_OCR_SIZE}
      - MAX_CSV_SIZE=${MAX_CSV_SIZE}
      - MAX_CSV_ROWS=${MAX_CSV_ROWS}
      - MAX_CSV_COLS=${MAX_CSV_COLS}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES}
      - DAILY_LOGO_UPLOADS_PER_COMPANY=${DAILY_LOGO_UPLOADS_PER_COMPANY}
      - DAILY_CSV_IMPORTS_PER_COMPANY=${DAILY_CSV_IMPORTS_PER_COMPANY}
      - DAILY_OCR_UPLOADS_PER_COMPANY=${DAILY_OCR_UPLOADS_PER_COMPANY}
      - DAILY_AI_REQUESTS_PER_COMPANY=${DAILY_AI_REQUESTS_PER_COMPANY}
      - MAX_AI_PROMPT_LENGTH=${MAX_AI_PROMPT_LENGTH}
      - AI_MAX_CONTEXT_LENGTH=${AI_MAX_CONTEXT_LENGTH}
      - AI_MAX_RESPONSE_SIZE=${AI_MAX_RESPONSE_SIZE}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS}
      - AI_ENABLE_PROMPT_INJECTION_DETECTION=${AI_ENABLE_PROMPT_INJECTION_DETECTION}
      - AI_ENABLE_OUTPUT_VALIDATION=${AI_ENABLE_OUTPUT_VALIDATION}
      - AI_LOG_VERBOSE=${AI_LOG_VERBOSE}
      - AI_LOG_PROMPTS_ENABLED=${AI_LOG_PROMPTS_ENABLED}
      - SUBSCRIPTION_RENEWAL_MAX_ATTEMPTS=${SUBSCRIPTION_RENEWAL_MAX_ATTEMPTS}
      - SUBSCRIPTION_RENEWAL_GRACE_PERIOD_DAYS=${SUBSCRIPTION_RENEWAL_GRACE_PERIOD_DAYS}
      - SUBSCRIPTION_RENEWAL_BATCH_SIZE=${SUBSCRIPTION_RENEWAL_BATCH_SIZE}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    volumes:
      - /mnt/storage/hitungbiz-company-photos:/app/uploads
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - STACK_NAME=${STACK_NAME}
      - APPLICATION_NAME=${APPLICATION_NAME}
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - SMTP_TLS=${SMTP_TLS}
      - SMTP_SSL=${SMTP_SSL}
      - SMTP_PORT=${SMTP_PORT}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - CHIP_API_URL=${CHIP_API_URL}
      - CHIP_SECRET_KEY=${CHIP_SECRET_KEY}
      - CHIP_BRAND_ID=${CHIP_BRAND_ID}
      - CHIP_WEBHOOK_URL=${CHIP_WEBHOOK_URL}
      - CHIP_WEBHOOK_PUBLIC_KEY=${CHIP_WEBHOOK_PUBLIC_KEY}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED}
      - SECURE_HSTS_ENABLED=${SECURE_HSTS_ENABLED}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD}
      - MAX_REQUEST_BODY_SIZE=${MAX_REQUEST_BODY_SIZE}
      - REMOVE_SERVER_HEADER=${REMOVE_SERVER_HEADER}
      - CSP_HEADER_OVERRIDE=${CSP_HEADER_OVERRIDE}
      - X_FRAME_OPTIONS=${X_FRAME_OPTIONS}
      - X_CONTENT_TYPE_OPTIONS=${X_CONTENT_TYPE_OPTIONS}
      - REFERRER_POLICY=${REFERRER_POLICY}
      - PERMISSIONS_POLICY=${PERMISSIONS_POLICY}
      - CROSS_ORIGIN_OPENER_POLICY=${CROSS_ORIGIN_OPENER_POLICY}
      - CROSS_ORIGIN_RESOURCE_POLICY=${CROSS_ORIGIN_RESOURCE_POLICY}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED}
      - RATE_LIMIT_TIER1_IP_PER_MIN=${RATE_LIMIT_TIER1_IP_PER_MIN}
      - RATE_LIMIT_TIER2_USER_PER_MIN=${RATE_LIMIT_TIER2_USER_PER_MIN}
      - RATE_LIMIT_TIER3_UPLOAD_PER_HR=${RATE_LIMIT_TIER3_UPLOAD_PER_HR}
      - RATE_LIMIT_TIER4_AI_PER_HR=${RATE_LIMIT_TIER4_AI_PER_HR}
      - MAX_CONCURRENT_AI_REQUESTS=${MAX_CONCURRENT_AI_REQUESTS}
      - MAX_LOGO_SIZE=${MAX_LOGO_SIZE}
      - MAX_OCR_SIZE=${MAX_OCR_SIZE}
      - MAX_CSV_SIZE=${MAX_CSV_SIZE}
      - MAX_CSV_ROWS=${MAX_CSV_ROWS}
      - MAX_CSV_COLS=${MAX_CSV_COLS}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES}
      - DAILY_LOGO_UPLOADS_PER_COMPANY=${DAILY_LOGO_UPLOADS_PER_COMPANY}
      - DAILY_CSV_IMPORTS_PER_COMPANY=${DAILY_CSV_IMPORTS_PER_COMPANY}
      - DAILY_OCR_UPLOADS_PER_COMPANY=${DAILY_OCR_UPLOADS_PER_COMPANY}
      - DAILY_AI_REQUESTS_PER_COMPANY=${DAILY_AI_REQUESTS_PER_COMPANY}
      - MAX_AI_PROMPT_LENGTH=${MAX_AI_PROMPT_LENGTH}
      - AI_MAX_CONTEXT_LENGTH=${AI_MAX_CONTEXT_LENGTH}
      - AI_MAX_RESPONSE_SIZE=${AI_MAX_RESPONSE_SIZE}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS}
      - AI_ENABLE_PROMPT_INJECTION_DETECTION=${AI_ENABLE_PROMPT_INJECTION_DETECTION}
      - AI_ENABLE_OUTPUT_VALIDATION=${AI_ENABLE_OUTPUT_VALIDATION}
      - AI_LOG_VERBOSE=${AI_LOG_VERBOSE}
      - AI_LOG_PROMPTS_ENABLED=${AI_LOG_PROMPTS_ENABLED}
      - SUBSCRIPTION_RENEWAL_MAX_ATTEMPTS=${SUBSCRIPTION_RENEWAL_MAX_ATTEMPTS}
      - SUBSCRIPTION_RENEWAL_GRACE_PERIOD_DAYS=${SUBSCRIPTION_RENEWAL_GRACE_PERIOD_DAYS}
      - SUBSCRIPTION_RENEWAL_BATCH_SIZE=${SUBSCRIPTION_RENEWAL_BATCH_SIZE}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - VITE_APP_NAME=${APPLICATION_NAME}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
volumes:
  app-db-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
