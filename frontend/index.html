<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>%VITE_APP_NAME%</title>
    
    <!-- PWA Metadata -->
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" />
    <meta name="application-name" content="%VITE_APP_NAME%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Inline SW Precached Splash Screen Styles for Installed Mobile PWA -->
    <style>
      #pwa-initial-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        user-select: none;
      }
      @media (prefers-color-scheme: light) {
        #pwa-initial-splash {
          background-color: #ffffff;
          color: #09090b;
        }
      }
      /* Display instantly on installed standalone mobile PWA */
      @media (display-mode: standalone) and (max-width: 768px) {
        #pwa-initial-splash {
          display: flex;
        }
      }
      .ios-standalone-mobile #pwa-initial-splash {
        display: flex;
      }

      .pwa-splash-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: pwa-splash-spin 0.8s linear infinite;
        margin-top: 1.5rem;
        margin-bottom: 1.5rem;
      }
      @keyframes pwa-splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <script>
      (() => {
        if (navigator.standalone && window.innerWidth <= 768) {
          document.documentElement.classList.add("ios-standalone-mobile");
        }
      })();
    </script>
  </head>
  <body>
    <!-- Immediate Precached Splash Screen rendered instantly before JS loads -->
    <div id="pwa-initial-splash">
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: center;">
        <picture>
          <source srcset="/assets/images/hitungbiz-logo.png" media="(prefers-color-scheme: dark)" />
          <img src="/assets/images/hitungbiz-logo.png" alt="hitungbiz Logo" style="height: 40px; width: auto;" />
        </picture>
      </div>
      <p style="font-size: 1rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0; opacity: 0.9;">
        Preparing your workspace...
      </p>
      <div class="pwa-splash-spinner"></div>
      <p style="font-size: 0.875rem; font-weight: 500; opacity: 0.7; margin: 0;">
        Loading company...
      </p>
    </div>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
