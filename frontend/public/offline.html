<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You are Offline</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 420px;
        padding: 2rem;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 0.75rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin-bottom: 1rem;
        border-radius: 0.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      button {
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/pwa-192x192.png" alt="Logo" class="icon" />
      <h1>You are Offline</h1>
      <p>It looks like you have lost your internet connection. An active network connection is required for real-time financial data.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
